name: Docs → Notion Sync

on:
  push:
    branches: [docs, main]
    paths:
      - 'docs/requirement-definition/**/*.md'
      - 'requirement-definition/**/*.md'

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            docs/requirement-definition/**/*.md
            requirement-definition/**/*.md

      - name: Debug - Show changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Sync to Notion
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          # Install dependencies
          npm install -g @actions/core
          
          # Create sync script
          cat > sync-to-notion.js << 'EOF'
          const { Client } = require('@notionhq/client');
          const fs = require('fs');
          const path = require('path');

          const notion = new Client({
            auth: process.env.NOTION_TOKEN,
          });

          const databaseId = process.env.NOTION_DATABASE_ID;

          function parseRichText(text) {
            const richText = [];
            let currentPos = 0;

            // Pattern to match markdown formatting
            const patterns = [
              { regex: /\*\*(.*?)\*\*/g, annotation: { bold: true } },
              { regex: /\*(.*?)\*/g, annotation: { italic: true } },
              { regex: /`(.*?)`/g, annotation: { code: true } }
            ];

            function addTextSegment(content, annotations = {}) {
              if (content) {
                richText.push({
                  type: 'text',
                  text: { content },
                  annotations: {
                    bold: false,
                    italic: false,
                    strikethrough: false,
                    underline: false,
                    code: false,
                    color: 'default',
                    ...annotations
                  }
                });
              }
            }

            let processedText = text;
            let segments = [{ text: processedText, annotations: {} }];

            for (const pattern of patterns) {
              const newSegments = [];
              
              for (const segment of segments) {
                if (segment.annotations[Object.keys(pattern.annotation)[0]]) {
                  newSegments.push(segment);
                  continue;
                }

                let lastIndex = 0;
                let match;
                pattern.regex.lastIndex = 0; // Reset regex

                while ((match = pattern.regex.exec(segment.text)) !== null) {
                  // Add text before match
                  if (match.index > lastIndex) {
                    newSegments.push({
                      text: segment.text.slice(lastIndex, match.index),
                      annotations: segment.annotations
                    });
                  }

                  // Add formatted text
                  newSegments.push({
                    text: match[1],
                    annotations: { ...segment.annotations, ...pattern.annotation }
                  });

                  lastIndex = pattern.regex.lastIndex;
                }

                // Add remaining text
                if (lastIndex < segment.text.length) {
                  newSegments.push({
                    text: segment.text.slice(lastIndex),
                    annotations: segment.annotations
                  });
                }
              }
              
              segments = newSegments;
            }

            // Convert segments to rich text
            segments.forEach(segment => {
              if (segment.text) {
                addTextSegment(segment.text, segment.annotations);
              }
            });

            return richText.length > 0 ? richText : [{ type: 'text', text: { content: text }, annotations: { bold: false, italic: false, strikethrough: false, underline: false, code: false, color: 'default' } }];
          }

          function parseMarkdownTable(lines, startIndex) {
            const tableData = [];
            let i = startIndex;
            
            while (i < lines.length && lines[i].includes('|')) {
              const line = lines[i].trim();
              
              // Skip separator rows (contains only dashes and pipes)
              if (line.match(/^\|[-\s|]+\|$/)) {
                i++;
                continue;
              }
              
              if (line.startsWith('|') && line.endsWith('|')) {
                const cells = line.split('|').slice(1, -1).map(cell => cell.trim());
                tableData.push(cells);
              }
              i++;
            }
            
            return { tableData, endIndex: i - 1 };
          }

          function createNotionTable(tableData) {
            if (tableData.length === 0) return [];
            
            const tableWidth = tableData[0].length;
            const blocks = [];
            
            // Create table block
            blocks.push({
              object: 'block',
              type: 'table',
              table: {
                table_width: tableWidth,
                has_column_header: true,
                has_row_header: false
              }
            });
            
            // Create table rows
            tableData.forEach(row => {
              blocks.push({
                object: 'block',
                type: 'table_row',
                table_row: {
                  cells: row.map(cell => parseRichText(cell))
                }
              });
            });
            
            return blocks;
          }

          function parseMarkdownToBlocks(content) {
            const lines = content.split('\n');
            const blocks = [];
            let currentParagraph = '';
            let inCodeBlock = false;
            let codeBlockContent = '';
            let codeLanguage = '';

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];

              // Code block start/end
              if (line.startsWith('```')) {
                if (inCodeBlock) {
                  // End code block - split if content is too long
                  const maxLength = 1900; // Leave buffer under 2000 limit
                  
                  if (codeBlockContent.length <= maxLength) {
                    blocks.push({
                      object: 'block',
                      type: 'code',
                      code: {
                        rich_text: [{ type: 'text', text: { content: codeBlockContent } }],
                        language: codeLanguage || 'plain text'
                      }
                    });
                  } else {
                    // Split long code blocks into chunks
                    let remainingContent = codeBlockContent;
                    let chunkNumber = 1;
                    
                    while (remainingContent.length > 0) {
                      const chunk = remainingContent.substring(0, maxLength);
                      remainingContent = remainingContent.substring(maxLength);
                      
                      blocks.push({
                        object: 'block',
                        type: 'code',
                        code: {
                          rich_text: [{ type: 'text', text: { content: chunk } }],
                          language: codeLanguage || 'plain text'
                        }
                      });
                      
                      // Add continuation indicator if there's more content
                      if (remainingContent.length > 0) {
                        blocks.push({
                          object: 'block',
                          type: 'paragraph',
                          paragraph: {
                            rich_text: [{ 
                              type: 'text', 
                              text: { content: `... (続き ${++chunkNumber})` },
                              annotations: { italic: true, color: 'gray' }
                            }]
                          }
                        });
                      }
                    }
                  }
                  
                  inCodeBlock = false;
                  codeBlockContent = '';
                  codeLanguage = '';
                } else {
                  // Start code block
                  if (currentParagraph.trim()) {
                    blocks.push({
                      object: 'block',
                      type: 'paragraph',
                      paragraph: { rich_text: parseRichText(currentParagraph.trim()) }
                    });
                    currentParagraph = '';
                  }
                  
                  codeLanguage = line.replace('```', '').trim();
                  inCodeBlock = true;
                }
                continue;
              }

              if (inCodeBlock) {
                codeBlockContent += (codeBlockContent ? '\n' : '') + line;
                continue;
              }

              // Heading
              if (line.startsWith('#')) {
                if (currentParagraph.trim()) {
                  blocks.push({
                    object: 'block',
                    type: 'paragraph',
                    paragraph: { rich_text: parseRichText(currentParagraph.trim()) }
                  });
                  currentParagraph = '';
                }

                const level = line.match(/^#+/)[0].length;
                const text = line.replace(/^#+\s*/, '');
                
                const headingType = level === 1 ? 'heading_1' : level === 2 ? 'heading_2' : 'heading_3';
                blocks.push({
                  object: 'block',
                  type: headingType,
                  [headingType]: { rich_text: parseRichText(text) }
                });
              }
              // Table handling - store table data for later processing
              else if (line.includes('|') && line.trim().startsWith('|')) {
                if (currentParagraph.trim()) {
                  blocks.push({
                    object: 'block',
                    type: 'paragraph',
                    paragraph: { rich_text: parseRichText(currentParagraph.trim()) }
                  });
                  currentParagraph = '';
                }

                const { tableData, endIndex } = parseMarkdownTable(lines, i);
                
                if (tableData.length > 0) {
                  // Mark as table placeholder - will be processed separately
                  blocks.push({
                    object: 'block',
                    type: 'table_placeholder',
                    table_data: tableData
                  });
                }
                
                i = endIndex;
              }
              // Empty line
              else if (line.trim() === '') {
                if (currentParagraph.trim()) {
                  blocks.push({
                    object: 'block',
                    type: 'paragraph',
                    paragraph: { rich_text: parseRichText(currentParagraph.trim()) }
                  });
                  currentParagraph = '';
                }
              }
              // List items
              else if (line.startsWith('- ') || line.match(/^\d+\. /)) {
                if (currentParagraph.trim()) {
                  blocks.push({
                    object: 'block',
                    type: 'paragraph',
                    paragraph: { rich_text: parseRichText(currentParagraph.trim()) }
                  });
                  currentParagraph = '';
                }

                const text = line.replace(/^[-\d]+\.?\s*/, '');
                blocks.push({
                  object: 'block',
                  type: 'bulleted_list_item',
                  bulleted_list_item: { rich_text: parseRichText(text) }
                });
              }
              // Regular text
              else {
                if (currentParagraph) {
                  currentParagraph += '\n' + line;
                } else {
                  currentParagraph = line;
                }
              }
            }

            // Add final paragraph if exists
            if (currentParagraph.trim()) {
              blocks.push({
                object: 'block',
                type: 'paragraph',
                paragraph: { rich_text: parseRichText(currentParagraph.trim()) }
              });
            }

            return blocks;
          }

          async function syncFileToNotion(filePath) {
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const fileName = path.basename(filePath, '.md');
              const relativePath = filePath;
              const folderPath = path.dirname(filePath);
              
              // Extract repo name from git config or use default
              const repoName = 'zigzaglab-02';
              
              // Split folder path into individual tags
              const folderTags = folderPath.split('/').filter(tag => tag !== '');
              
              // Check if page already exists
              const existingPages = await notion.databases.query({
                database_id: databaseId,
                filter: {
                  property: 'Path',
                  rich_text: {
                    equals: relativePath
                  }
                }
              });

              // Parse markdown to Notion blocks
              const contentBlocks = parseMarkdownToBlocks(content);

              // Process blocks sequentially to maintain order
              const chunkSize = 90;

              const pageData = {
                parent: { database_id: databaseId },
                properties: {
                  'Title': {
                    title: [{ text: { content: fileName } }]
                  },
                  'Repo': {
                    select: { name: repoName }
                  },
                  'Folder': {
                    multi_select: folderTags.map(tag => ({ name: tag }))
                  },
                  'Path': {
                    rich_text: [{ text: { content: relativePath } }]
                  },
                  'Last Synced': {
                    date: { start: new Date().toISOString() }
                  }
                },
                children: [] // Start with empty page
              };

              if (existingPages.results.length > 0) {
                // Update existing page
                const pageId = existingPages.results[0].id;
                await notion.pages.update({
                  page_id: pageId,
                  properties: pageData.properties
                });
                
                // Clear existing content
                const blocks = await notion.blocks.children.list({
                  block_id: pageId
                });
                
                // Delete existing blocks
                for (const block of blocks.results) {
                  try {
                    await notion.blocks.delete({ block_id: block.id });
                  } catch (e) {
                    // Skip if block can't be deleted
                  }
                }
                
                // Process blocks sequentially to maintain order
                await processBlocksSequentially(notion, pageId, contentBlocks);
                
                console.log(`Updated: ${fileName} (${contentBlocks.length} blocks)`);
              } else {
                // Create new page with initial chunk
                const newPage = await notion.pages.create(pageData);
                
                // Process blocks sequentially to maintain order
                await processBlocksSequentially(notion, newPage.id, contentBlocks);
                
                console.log(`Created: ${fileName} (${contentBlocks.length} blocks)`);
              }
            } catch (error) {
              console.error(`Error syncing ${filePath}:`, error);
            }
          }

          async function main() {
            const changedFiles = process.env.CHANGED_FILES.split(' ');
            
            for (const file of changedFiles) {
              if (file.endsWith('.md')) {
                await syncFileToNotion(file);
              }
            }
          }

          // Process blocks sequentially to maintain order
          async function processBlocksSequentially(notion, pageId, blocks) {
            const chunkSize = 80;
            let regularBlocksBuffer = [];
            
            for (const block of blocks) {
              if (block.type === 'table_placeholder') {
                // Process any buffered regular blocks first
                if (regularBlocksBuffer.length > 0) {
                  await addRegularBlocksInChunks(notion, pageId, regularBlocksBuffer, chunkSize);
                  regularBlocksBuffer = [];
                }
                
                // Process table
                try {
                  await createNotionTable(notion, pageId, block.table_data);
                } catch (error) {
                  console.error('Error creating table:', error);
                  // Fallback: Convert table to paragraphs
                  const fallbackBlocks = block.table_data.map(row => ({
                    object: 'block',
                    type: 'paragraph',
                    paragraph: {
                      rich_text: [{ type: 'text', text: { content: row.join(' | ') } }]
                    }
                  }));
                  
                  await notion.blocks.children.append({
                    block_id: pageId,
                    children: fallbackBlocks
                  });
                }
              } else {
                regularBlocksBuffer.push(block);
              }
            }
            
            // Process any remaining regular blocks
            if (regularBlocksBuffer.length > 0) {
              await addRegularBlocksInChunks(notion, pageId, regularBlocksBuffer, chunkSize);
            }
          }

          async function addRegularBlocksInChunks(notion, pageId, blocks, chunkSize) {
            for (let i = 0; i < blocks.length; i += chunkSize) {
              const chunk = blocks.slice(i, i + chunkSize);
              await notion.blocks.children.append({
                block_id: pageId,
                children: chunk
              });
              
              if (i + chunkSize < blocks.length) {
                await new Promise(resolve => setTimeout(resolve, 200));
              }
            }
          }

          // Table creation function using 2-step approach
          async function createNotionTable(notion, pageId, tableData) {
            if (tableData.length === 0) return;
            
            const tableWidth = tableData[0].length;
            
            // Step 1: Create table block
            const tableBlock = await notion.blocks.children.append({
              block_id: pageId,
              children: [{
                type: 'table',
                table: {
                  table_width: tableWidth,
                  has_column_header: true,
                  has_row_header: false
                }
              }]
            });
            
            const tableId = tableBlock.results[0].id;
            
            // Step 2: Add table rows in batches
            const batchSize = 70; // Conservative limit
            for (let i = 0; i < tableData.length; i += batchSize) {
              const batch = tableData.slice(i, i + batchSize);
              
              const rows = batch.map(row => ({
                type: 'table_row',
                table_row: {
                  cells: row.map(cellContent => [{
                    type: 'text',
                    text: { content: cellContent },
                    annotations: {
                      bold: false,
                      italic: false,
                      code: false,
                      color: 'default'
                    }
                  }])
                }
              }));
              
              await notion.blocks.children.append({
                block_id: tableId, // Add to table, not page
                children: rows
              });
              
              // Rate limiting delay
              if (i + batchSize < tableData.length) {
                await new Promise(resolve => setTimeout(resolve, 300));
              }
            }
            
            console.log(`Created table with ${tableData.length} rows`);
          }

          main().catch(console.error);
          EOF

          # Install Notion SDK
          npm install @notionhq/client

          # Run sync script
          CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}" node sync-to-notion.js

      - name: Report sync results
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "✅ Sync completed for the following files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"